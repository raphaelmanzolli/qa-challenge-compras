# QA Challenge — Compras Diretas (ambiente LOCAL do candidato)
# 1) docker load -i qa-challenge-compras-*.tar
# 2) docker compose up -d
# Reset completo: docker compose down -v && docker compose up -d
name: qa-compras

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compras}
      POSTGRES_USER: ${POSTGRES_USER:-compras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compras-local}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: qa-challenge-compras:1.0
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-compras}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-compras}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-compras-local}
      JWT_SECRET: ${JWT_SECRET:-segredo-local-somente-demonstracao-troque-me-0123456789}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DesafioQA@2026}
      DISPUTE_OPEN_DELAY_SECONDS: ${DISPUTE_OPEN_DELAY_SECONDS:-10}
      DISPUTE_DURATION_SECONDS: ${DISPUTE_DURATION_SECONDS:-45}
      FRONTEND_POLL_INTERVAL_MS: ${FRONTEND_POLL_INTERVAL_MS:-2000}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
    restart: unless-stopped

volumes:
  dbdata:
